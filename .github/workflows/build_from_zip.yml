# Mundus build pipeline from a PUBLISHED release zip (public)
#
# Same idea as build-test.yml — the app is built from an UPLOADED ZIP attached
# to a release, NOT from the checked-out repo (so the repo source can even be
# older than the release without mislabeling anything). Differences from
# build-test.yml:
#   - The zip comes from a PUBLISHED release, addressed by TAG
#     (e.g. tag v0.8.68 + asset mundus_v0.8.68.zip), not from a private draft.
#   - Every built file (Windows/macOS/Linux installers + signed APK) is
#     attached BACK to that same release, replacing same-named assets on re-runs.
#   - Version guard: the zip's package.json (and the Android versionName) must
#     match the release tag — otherwise the run fails loudly instead of
#     attaching 0.8.65-named files to a v0.8.68 release. Set
#     allow_version_mismatch to true to bypass (not recommended).
#
# Usage (Actions tab → "Build from published release zip" → Run workflow):
#   release_tag: v0.8.68            (the release the zip lives on)
#   zip_name:    mundus_v0.8.68.zip (exact asset name of the source zip)
#
# Required secrets (only for the APK job): KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD. If they are absent the APK job fails — the desktop
# installers still attach (it is deliberately non-fatal).
#
# Caveat: workflow artifacts on a public repo are readable by anyone with read
#   access. They are only the intermediate hand-off between jobs and auto-expire
#   after 14 days; the real deliverables are the release assets.

name: Build from published release zip

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release the zip is attached to (e.g. v0.8.68)'
        required: true
        type: string
      zip_name:
        description: 'Exact name of the source zip asset (e.g. mundus_v0.8.68.zip)'
        required: true
        type: string
      allow_version_mismatch:
        description: 'Allow zip version != release tag (NOT recommended)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Desktop installers (Windows / Linux / macOS), built from the zip
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Download zip from the release (by tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.zip_name }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null)
          [ -n "$ID" ] || { echo "::error::No release found for tag '$TAG'. Publish the release (or push the tag), attach '$ASSET' to it, then re-run."; exit 1; }
          ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG/assets" \
                     --jq '.[] | select(.name == env.ASSET) | .id')
          [ -n "$ASSET_ID" ] || { echo "::error::'$ASSET' is not attached to the '$TAG' release. Attach the source zip and re-run."; exit 1; }
          curl --fail -sSL \
               -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               -o "$ASSET" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          ls -lh "$ASSET"

      - name: Extract zip and locate project root
        shell: bash
        run: |
          mkdir -p project
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "${{ inputs.zip_name }}" -d project
          elif command -v 7z >/dev/null 2>&1; then
            7z x "${{ inputs.zip_name }}" -oproject >/dev/null
          else
            echo "::error::Neither unzip nor 7z is available on this runner"
            exit 1
          fi
          if [ -f project/package.json ] && [ -d project/android ]; then
            ROOT=project
          else
            ROOT=""
            for pj in $(find project -maxdepth 3 -name package.json); do
              d=$(dirname "$pj")
              if [ -d "$d/android" ]; then ROOT="$d"; break; fi
            done
          fi
          test -n "$ROOT" || { echo "::error::Could not find project root (package.json + android/) in the zip"; exit 1; }
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.ROOT }}/package-lock.json

      # The zip is the source of truth, but the artifacts will hang on the
      # release identified by the tag — make sure they agree (v0.8.65-named
      # files on a v0.8.68 release were exactly this kind of mismatch).
      - name: Version guard — zip must match the release tag
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ inputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            if [ "${{ inputs.allow_version_mismatch }}" = "true" ]; then
              echo "::warning::Zip version $PKG_VERSION differs from release tag $TAG_VERSION (allowed by input). Artifacts will be named with $PKG_VERSION."
            else
              echo "::error::Zip version ($PKG_VERSION) does not match the release tag ($TAG_VERSION)."
              echo "::error::Attach the matching zip (or set allow_version_mismatch=true, NOT recommended)."
              exit 1
            fi
          fi
          echo "Version guard OK: zip source $PKG_VERSION == release $TAG_VERSION"

      - name: Install dependencies
        working-directory: ${{ env.ROOT }}
        run: npm ci

      - name: Build app (web + electron main)
        working-directory: ${{ env.ROOT }}
        run: npm run build

      # FIXED: package is libarchive-tools (provides bsdtar), not "bsdtar".
      - name: Install Arch packaging tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libarchive-tools zstd fakeroot

      - name: Package native installers
        working-directory: ${{ env.ROOT }}
        env:
          # Skip code-signing identity lookup (no certs in CI by design)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: List built installers (debug)
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: ls -la release/ || true

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ env.ROOT }}/release/*.exe
            ${{ env.ROOT }}/release/*.dmg
            ${{ env.ROOT }}/release/*.zip
            ${{ env.ROOT }}/release/*.AppImage
            ${{ env.ROOT }}/release/*.deb
            ${{ env.ROOT }}/release/*.rpm
            ${{ env.ROOT }}/release/*.pacman
            ${{ env.ROOT }}/release/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Signed Android APK, built from the same zip
  # ─────────────────────────────────────────────────────────────────────
  build-apk:
    name: Signed Android APK
    # Non-fatal: if this fails (e.g. missing keystore secrets), desktop assets
    # still attach to the release. Re-run the failed job to retry.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Download zip from the release (by tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.zip_name }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null)
          [ -n "$ID" ] || { echo "::error::No release found for tag '$TAG'."; exit 1; }
          ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG/assets" \
                     --jq '.[] | select(.name == env.ASSET) | .id')
          [ -n "$ASSET_ID" ] || { echo "::error::'$ASSET' is not attached to the '$TAG' release."; exit 1; }
          curl --fail -sSL \
               -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               -o "$ASSET" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          ls -lh "$ASSET"

      - name: Extract zip and locate project root
        shell: bash
        run: |
          mkdir -p project
          unzip -q "${{ inputs.zip_name }}" -d project
          if [ -f project/package.json ] && [ -d project/android ]; then
            ROOT=project
          else
            ROOT=""
            for pj in $(find project -maxdepth 3 -name package.json); do
              d=$(dirname "$pj")
              if [ -d "$d/android" ]; then ROOT="$d"; break; fi
            done
          fi
          test -n "$ROOT" || { echo "::error::Could not find project root (package.json + android/) in the zip"; exit 1; }
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Fail fast on unsynced zips
        run: |
          test -f "$ROOT/android/app/src/main/assets/public/index.html" \
            || { echo "::error::Zip has no built web payload under android/. Run 'npm run android:sync' before packing."; exit 1; }

      # Same guard as the desktop job — plus the gradle versionName that
      # actually gets stamped into the APK.
      - name: Version guard — zip must match the release tag
        run: |
          PKG_VERSION=$(jq -r '.version' "$ROOT/package.json")
          TAG_VERSION="${{ inputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            if [ "${{ inputs.allow_version_mismatch }}" = "true" ]; then
              echo "::warning::Zip version $PKG_VERSION differs from release tag $TAG_VERSION (allowed by input)."
            else
              echo "::error::Zip version ($PKG_VERSION) does not match the release tag ($TAG_VERSION)."; exit 1
            fi
          fi
          GRADLE_VERSION=$(node -e "const m=require('fs').readFileSync('$ROOT/android/app/build.gradle','utf8').match(/versionName\s+\"([^\"]+)\"/);console.log(m?m[1]:'')")
          if [ -n "$GRADLE_VERSION" ] && [ "$GRADLE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::android/app/build.gradle versionName ($GRADLE_VERSION) does not match the zip's package.json ($PKG_VERSION) — re-run 'npm run android:sync' before packing."
            exit 1
          fi
          echo "Version guard OK: zip $PKG_VERSION == release $TAG_VERSION, gradle versionName $GRADLE_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mundus-v1
          restore-keys: gradle-mundus-v1

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$ROOT/android/app/release.keystore"
          ls -lh "$ROOT/android/app/release.keystore"
          file "$ROOT/android/app/release.keystore"

      - name: Build APK (release variant)
        working-directory: ${{ env.ROOT }}/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect signed APK
        run: |
          mkdir -p apk-out
          VERSION=$(jq -r '.version' "$ROOT/package.json")
          echo "APK version from package.json: $VERSION"
          found=""
          for f in $(find "$ROOT/android/app/build/outputs/apk/release" -name '*.apk'); do
            found=1
            cp "$f" "apk-out/Mundus_v${VERSION}.apk"
          done
          [ -n "$found" ] || { echo "::error::Gradle produced no signed release APK"; exit 1; }
          ls -lh apk-out

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: apk-out/*
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Attach everything back to the SAME release (by tag)
  # ─────────────────────────────────────────────────────────────────────
  attach-to-release:
    name: Attach all files to the release
    needs: [build, build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List files to attach
        run: |
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "::error::No artifacts downloaded — nothing to attach"
            exit 1
          fi
          ls -lh release-assets/

      - name: Attach to release (replace same-name assets)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null)
          [ -n "$ID" ] || { echo "::error::No release found for tag '$TAG'."; exit 1; }
          echo "Release id: $ID"
          for f in release-assets/*; do
            NAME=$(basename "$f")
            OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
                  --jq ".[] | select(.name == \"$NAME\") | .id" | head -n1)
            if [ -n "$OLD" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD" || true
              echo "Replaced: $NAME"
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$NAME" \
              --jq '"Attached: " + .name + " (" + (.size|tostring) + " bytes)"'
          done
          echo "Done — check https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "NOTE: assets from older builds with DIFFERENT names (e.g. the stale 0.8.65 installers) are not removed automatically — delete those manually on the release page once."
