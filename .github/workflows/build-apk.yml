name: Build Android APK (from uploaded zip — draft release, private)

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Title of your DRAFT release (e.g. CI build inputs)'
        required: true
        type: string
        default: 'CI build inputs'
      zip_name:
        description: 'Exact zip asset name (e.g. mundus_v0.8.6.zip)'
        required: true
        type: string
      attach_apk_to_draft:
        description: 'Attach built APK to the draft (private to you)'
        type: boolean
        default: true
      upload_public_artifact:
        description: 'Also upload APK as run artifact (PUBLIC on a public repo!)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download zip from the draft release (invisible to the public)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
          ASSET: ${{ inputs.zip_name }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                --jq '.[] | select(.draft and .name == env.RELEASE_NAME) | .id' | head -n1)
          [ -n "$ID" ] || { echo "::error::No DRAFT release titled '$RELEASE_NAME'. Create it (do NOT publish) and attach the zip."; exit 1; }
          ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
                     --jq '.[] | select(.name == env.ASSET) | .id')
          [ -n "$ASSET_ID" ] || { echo "::error::'$ASSET' not attached to the draft"; exit 1; }
          curl --fail -sSL \
               -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               -o "$ASSET" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          ls -lh "$ASSET"

      - name: Unzip and locate the Android project
        run: |
          unzip -q "${{ inputs.zip_name }}" -d project
          if [ ! -d project/android ]; then
            found=$(find project -maxdepth 3 -type d -name android | head -1)
            [ -n "$found" ] && mv "$found" project/android
          fi
          test -d project/android || { echo "::error::No android/ folder in this zip"; exit 1; }

      - name: Fail fast on source-only zips
        run: |
          test -f project/android/app/src/main/assets/public/index.html \
            || { echo "::error::Zip has no built web payload. Run 'npm run android:sync' and re-pack."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # --- INJECT PERMANENT KEYSTORE ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > project/android/app/release.keystore
          
      # --- VERIFY KEYSTORE (Debug Step) ---
      - name: Verify Keystore
        run: |
          ls -lh project/android/app/release.keystore
          file project/android/app/release.keystore

      # --- BUILD RELEASE APK ---
      - name: Build APK (release variant)
        working-directory: project/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK_PATHS=$(find project/android/app/build/outputs/apk -name '*.apk' | tr '\n' ' ')
          echo "paths=$APK_PATHS" >> "$GITHUB_OUTPUT"

      # --- ATTACH TO DRAFT RELEASE ---
      - name: Attach APK to the draft (only you can see it)
        if: ${{ inputs.attach_apk_to_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                --jq '.[] | select(.draft and .name == env.RELEASE_NAME) | .id' | head -n1)
          [ -n "$ID" ] || { echo "::error::No DRAFT release titled '$RELEASE_NAME' found. Keep it a draft (do NOT publish) and match the title exactly."; exit 1; }
          echo "Draft release id: $ID"
          for f in ${{ steps.apk.outputs.paths }}; do
            NAME=$(basename "$f")
            OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
                  --jq ".[] | select(.name == \"$NAME\") | .id" | head -n1)
            if [ -n "$OLD" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD" || true
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$NAME" \
              --jq '"Attached: " + .name + " (" + (.size|tostring) + " bytes)"'
          done
          echo "APK attached to draft '$RELEASE_NAME' (private to you)"

      # --- OPT-IN PUBLIC ARTIFACT ---
      - name: Upload APK as public run artifact (opt-in)
        if: ${{ inputs.upload_public_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: mundus-apk
          path: ${{ steps.apk.outputs.paths }}
          if-no-files-found: error

      - name: Cache Gradle for next time
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mundus-v1
          restore-keys: gradle-mundus-v1
