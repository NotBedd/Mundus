# Mundus release build pipeline
#
# How it works:
#   1. Push a tag named like the app version (e.g. v0.8.62) — or run manually
#      from the Actions tab (workflow_dispatch).
#   2. Three virtual machines (Windows / Linux / macOS) each install the
#      dependencies, build the app, and package native installers with
#      electron-builder (targets configured in electron-builder.json).
#      A fourth job (ubuntu) builds the Android APK in the SAME run: it builds
#      the web bundle, runs the Capacitor sync (npm run android:sync), decodes
#      the permanent release keystore from repo secrets, and packages android/
#      with Gradle (assembleRelease — signed with the real release key, so the
#      APK is release-grade: installable, upgradeable, and Play-Store eligible).
#   3. On a tag build, ALL installers AND the signed APK are attached to the
#      GitHub Release at github.com/<owner>/<repo>/releases — the permanent
#      download page. The APK is named Mundus_<tag>.apk (e.g. Mundus_v0.9.45.apk).
#      The APK job is deliberately non-fatal (continue-on-error): if Android
#      ever fails, the desktop release still publishes and the failed APK job
#      shows a red X on the run summary.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64      base64-encoded release.keystore
#   KEYSTORE_PASSWORD    keystore password
#   KEY_ALIAS            key alias inside the keystore
#   KEY_PASSWORD         key password
#
# Notes:
#   - Public repos: unlimited free build minutes. Private repos: 2,000 min/month
#     (one full run of this pipeline uses roughly 35-55 aggregate minutes).
#   - Desktop artifacts are UNSIGNED: Windows shows a one-time SmartScreen prompt
#     ("More info -> Run anyway"); macOS needs right-click -> Open on first
#     launch. The APK is signed with the permanent release keystore.

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $PKG_VERSION (tag: ${GITHUB_REF_NAME})"

      - name: Install dependencies
        run: npm ci

      - name: Build app (web + electron main)
        run: npm run build

      # FIXED: package is libarchive-tools (provides bsdtar), not "bsdtar".
      # zstd + fakeroot are cheap insurance for the pacman target.
      - name: Install Arch packaging tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libarchive-tools zstd fakeroot

      - name: Package native installers
        env:
          # Skip code-signing identity lookup (no certs in CI by design)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      # NEW: shows exactly what was produced — invaluable if a pattern ever
      # stops matching (e.g. electron-builder changes a filename).
      - name: List built installers (debug)
        shell: bash
        run: ls -la release/ || true

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  build-apk:
    name: Build signed Android APK
    # Intentionally non-fatal: if this job fails, the desktop release still
    # publishes (the job just shows a red X on the run summary). Remove this
    # line if you want a broken APK to block the whole release.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mundus-v1
          restore-keys: gradle-mundus-v1

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync it into the Android project
        run: npm run android:sync

      - name: Verify synced web payload
        run: |
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::Capacitor sync produced no android/app/src/main/assets/public/index.html"; exit 1; }

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # --- INJECT PERMANENT RELEASE KEYSTORE ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Verify Keystore
        run: |
          ls -lh android/app/release.keystore
          file android/app/release.keystore

      # --- BUILD SIGNED RELEASE APK ---
      - name: Build APK (release variant)
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect signed APK
        run: |
          mkdir -p apk-out

          # Name the APK after the tag (e.g. v0.9.45 -> Mundus_v0.9.45.apk).
          # Manual workflow_dispatch runs aren't tied to a tag, so fall back to
          # the package.json version; the release job only publishes on tags.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            LABEL="$GITHUB_REF_NAME"
          else
            LABEL="v$(node -p "require('./package.json').version")"
          fi
          echo "APK label: $LABEL"

          found=""
          # Only grab release (signed) output, ignore anything debug
          for f in $(find android/app/build/outputs/apk/release -name '*.apk'); do
            found=1
            cp "$f" "apk-out/Mundus_${LABEL}.apk"
          done
          [ -n "$found" ] || { echo "::error::Gradle produced no signed release APK"; exit 1; }
          ls -lh apk-out

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: apk-out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach installers to GitHub Release
    needs: [build, build-apk]
    # Only publish a Release for tag pushes (manual runs just build artifacts)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mundus ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          make_latest: true
